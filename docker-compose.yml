services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - NEXUS_ENV=production
      - NEXUS_HOST=0.0.0.0
      - NEXUS_PORT=8000
    volumes:
      - nexus_data:/app/apps/api/data

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./apps/desktop:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - api

volumes:
  nexus_data:
