name: NexusIT Cross-Platform Matrix CI/CD

on:
  push:
    branches: [ "main", "arena/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend-engines:
    name: Backend Unit & Integration Tests (Python 3.11+)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run Engine & API Pytest Suites
        run: |
          python -m pytest apps/api/tests/ -v --junitxml=pytest-report.xml

  build-desktop-linux:
    name: Linux Desktop Matrix (AppImage, .deb, .rpm)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Linux Build Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Frontend Assets
        run: |
          cd apps/desktop
          npm install
          npm run build

      - name: Build Linux Desktop Packages (Tauri v2)
        run: |
          cd apps/desktop
          npx tauri build --target x86_64-unknown-linux-gnu

      - name: Upload Linux Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexusit-linux-x86_64
          path: apps/desktop/src-tauri/target/release/bundle/

  build-desktop-windows:
    name: Windows 10/11 Desktop Matrix (NSIS, MSI)
    runs-on: windows-2022
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Frontend Assets
        run: |
          cd apps/desktop
          npm install
          npm run build

      - name: Build Windows Installers (NSIS & MSI)
        run: |
          cd apps/desktop
          npx tauri build --target x86_64-pc-windows-msvc

      - name: Upload Windows Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexusit-windows-x86_64
          path: apps/desktop/src-tauri/target/release/bundle/
